name: Retirar NURK 0.60
on:
  push:
    paths:
      - '.github/workflows/publicar-v60.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retirar:
    runs-on: ubuntu-latest
    steps:
      - name: Remover a versão pública 0.60
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete v0.60 --yes
